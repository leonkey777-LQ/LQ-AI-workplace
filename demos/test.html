<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>唐山打工人 AI 提效潜力 1 分钟诊断｜糖玩 AI 实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .opt-card { transition: all 0.18s ease; }
    .opt-selected {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(37, 99, 235, 0.22)) !important;
      border-color: #34d399 !important;
      box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.4);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.3s ease forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center px-4 py-6">

  <div class="max-w-lg w-full space-y-5">

    <!-- 顶栏徽章 -->
    <header class="flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-blue-600 flex items-center justify-center text-sm font-bold shadow-lg">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <div class="text-sm font-extrabold text-white tracking-tight">AI 提效潜力 1 分钟诊断</div>
          <div class="text-[11px] text-slate-400">纯前端本地计算 · 零隐私上传</div>
        </div>
      </div>
      <button onclick="quickDemoFill()" class="text-[11px] bg-slate-900 hover:bg-slate-800 border border-slate-700 text-amber-300 px-2.5 py-1.5 rounded-xl font-bold transition">
        ⚡ 一键模拟结果
      </button>
    </header>

    <!-- 测评区 -->
    <section id="quizPanel" class="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-2xl space-y-5 fade-up">
      <!-- 进度条 -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center text-xs">
          <span class="text-emerald-400 font-bold" id="stepCounter">第 1 / 5 题</span>
          <span class="text-slate-400" id="stepHint">预计耗时 45 秒</span>
        </div>
        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div id="quizProgressBar" class="h-full bg-gradient-to-r from-emerald-400 to-blue-500 transition-all duration-300" style="width: 20%"></div>
        </div>
      </div>

      <!-- 题目主体 -->
      <div id="questionBox" class="space-y-3.5"></div>

      <!-- 底部翻页 -->
      <div class="flex items-center justify-between pt-2">
        <button id="prevBtn" onclick="prevQuestion()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl font-bold transition">
          <i class="fa-solid fa-arrow-left mr-1"></i>上一题
        </button>
        <div class="flex-1"></div>
        <button id="nextBtn" onclick="nextQuestion()" disabled class="text-xs bg-slate-800 text-slate-500 px-5 py-2.5 rounded-xl font-bold transition cursor-not-allowed">
          下一题 <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </div>
    </section>

    <!-- 结果报告区 -->
    <section id="resultPanel" class="hidden space-y-4 fade-up">
      <!-- 核心数字卡 -->
      <div class="bg-gradient-to-br from-slate-900 via-indigo-950/80 to-slate-900 border border-emerald-500/35 rounded-3xl p-5 sm:p-6 shadow-2xl space-y-4">
        <div class="flex items-start justify-between gap-2">
          <div>
            <span id="resTierBadge" class="text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">S级 · 高杠杆提效型</span>
            <h2 id="resHeadline" class="text-lg sm:text-xl font-extrabold text-white mt-2 leading-snug">你的岗位极适合装上 AI 外挂</h2>
          </div>
          <button onclick="restartQuiz()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg shrink-0 transition">
            重测
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div class="bg-slate-950/75 border border-slate-800 rounded-2xl p-3 text-center">
            <div class="text-[10px] text-slate-400">每周可省工时</div>
            <div id="resWeeklyHours" class="text-xl sm:text-2xl font-black text-amber-400 mt-0.5">8.5h</div>
          </div>
          <div class="bg-slate-950/75 border border-slate-800 rounded-2xl p-3 text-center">
            <div class="text-[10px] text-slate-400">全年多出假期</div>
            <div id="resAnnualDays" class="text-xl sm:text-2xl font-black text-emerald-400 mt-0.5">53天</div>
          </div>
          <div class="bg-slate-950/75 border border-slate-800 rounded-2xl p-3 text-center">
            <div class="text-[10px] text-slate-400">提效潜力指数</div>
            <div id="resScore" class="text-xl sm:text-2xl font-black text-blue-400 mt-0.5">88分</div>
          </div>
        </div>

        <!-- ECharts 5维雷达图容器 -->
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-2xl p-3">
          <div class="text-[11px] font-bold text-slate-300 mb-1 flex items-center justify-between">
            <span><i class="fa-solid fa-chart-pie text-blue-400 mr-1.5"></i>五维 AI 提效杠杆雷达图</span>
            <span class="text-[10px] text-slate-500">数值越高代表越值得优先上 AI</span>
          </div>
          <div id="radarChart" class="w-full h-60"></div>
        </div>
      </div>

      <!-- 专属 3 步免费提效处方 -->
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3.5">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-extrabold text-white flex items-center">
            <i class="fa-solid fa-prescription-bottle-medical text-emerald-400 mr-2"></i>为你定制的 3 步免费提效处方
          </h3>
          <span class="text-[10px] text-slate-400">明天上班就能直接用</span>
        </div>
        <div id="prescriptionList" class="space-y-2.5 text-xs"></div>
      </div>

      <!-- 分享与保存 -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="copyShareSummary()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 rounded-2xl transition shadow-lg flex items-center justify-center">
          <i class="fa-regular fa-copy mr-1.5"></i>复制我的诊断结果
        </button>
        <button onclick="restartQuiz()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold py-3 rounded-2xl transition flex items-center justify-center">
          <i class="fa-solid fa-rotate-right mr-1.5"></i>换个角色再测一次
        </button>
      </div>
    </section>

    <footer class="text-center text-[11px] text-slate-500 pt-2">
      糖玩 AI 实验室 · 唐山极客效率工具箱｜纯静态离线计算，不收集任何个人隐私
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-2xl"></div>

  <script>
    const QUESTIONS = [
      {
        id: 'role',
        title: '1. 你目前最核心的工作 / 身份场景是？',
        desc: '选最贴近你日常耗时的角色',
        options: [
          { id: 'gov',   label: '体制内 / 国企 / 综合文字与汇报岗', sub: '常写周报、汇报材料、会议纪要与 PPT', hours: 2.5, radar: [95, 70, 90, 45, 50] },
          { id: 'ops',   label: '财务 / 行政 / HR / 采购与运营岗', sub: '常洗 Excel 脏表、对账、筛简历或查制度', hours: 3.0, radar: [70, 96, 85, 40, 65] },
          { id: 'biz',   label: '实体店主 / 销售 / 同城自媒体副业', sub: '缺文案、缺首图、想拍视频又懒得天天出镜', hours: 3.2, radar: [60, 55, 65, 98, 75] },
          { id: 'maker', label: '技术 / 外贸 / 创业者 / 超级个体', sub: '想用 AI 写网页小工具、搭智能体或接单变现', hours: 3.5, radar: [75, 80, 88, 72, 98] }
        ]
      },
      {
        id: 'writing',
        title: '2. 你每周花在写材料、写文案、做 PPT 上的时间大约多久？',
        desc: '包含构思、找素材和调排版',
        options: [
          { id: 'w1', label: '不到 2 小时', sub: '偶尔写点简单记录', hours: 1.0, boost: [10, 0, 0, 5, 0] },
          { id: 'w2', label: '2 ～ 5 小时', sub: '每周固定要交周报或几篇文案', hours: 2.8, boost: [20, 0, 5, 12, 0] },
          { id: 'w3', label: '5 ～ 10 小时', sub: '经常改稿改到下班点，PPT 排版耗时', hours: 5.2, boost: [30, 5, 10, 18, 5] },
          { id: 'w4', label: '10 小时以上（重度文字/内容苦力）', sub: '一半工作时间都在码字和做汇报', hours: 8.0, boost: [35, 5, 15, 22, 8] }
        ]
      },
      {
        id: 'data',
        title: '3. 每周花在整理表格、核对数据、翻查文档资料上的时间？',
        desc: '如多表汇总、查规章合同、比价或整理客户信息',
        options: [
          { id: 'd1', label: '几乎没有（< 1 小时）', sub: '很少碰复杂表格和长文档', hours: 0.5, boost: [0, 5, 5, 0, 0] },
          { id: 'd2', label: '1 ～ 4 小时', sub: '偶尔写 VLOOKUP 或翻几十页 PDF', hours: 2.2, boost: [0, 18, 18, 0, 8] },
          { id: 'd3', label: '4 ～ 8 小时', sub: '经常合并多张表、核对异常数据或标书', hours: 4.5, boost: [5, 28, 25, 0, 15] },
          { id: 'd4', label: '8 小时以上（重度数据/台账岗）', sub: '月底对账或旺季汇总经常熬夜加班', hours: 7.0, boost: [5, 35, 30, 0, 22] }
        ]
      },
      {
        id: 'pain',
        title: '4. 你现在使用 AI 工具时，最真实的卡点是什么？',
        desc: '坦诚选择，决定给你的处方精准度',
        options: [
          { id: 'p1', label: '很少用，不知道具体哪些工具靠谱', sub: '看到满屏新名词就头大，怕折腾', mult: 1.05, tag: '入门提效' },
          { id: 'p2', label: '用过但“AI 味太重”，写完还得自己重写', sub: '套话连篇、数据瞎编，不敢直接交差', mult: 1.12, tag: '去AI味与零幻觉' },
          { id: 'p3', label: '只会简单聊天，不会做图、剪视频或串工作流', sub: '想批量产出高质量图文/数字人/自动表格', mult: 1.18, tag: '多模态与工作流' },
          { id: 'p4', label: '想做自己的网页工具或接单，但一碰代码就报错', sub: '零基础想跑通 Cursor + 云端免费发版', mult: 1.22, tag: 'Vibe Coding 造物' }
        ]
      },
      {
        id: 'goal',
        title: '5. 接下来 30 天，你最想拿到的 1 个硬核结果是？',
        desc: '聚焦 1 个目标最容易见效',
        options: [
          { id: 'g1', label: '把公文、PPT 和 Excel 提速 3 倍，准点下班', sub: '建立专属文风库与零幻觉知识库', track: 'work' },
          { id: 'g2', label: '跑通同城图文/数字人短视频，拉客流或做副业', sub: '不焦虑出镜，15 分钟日更一条', track: 'aigc' },
          { id: 'g3', label: '零代码亲手上线 2 个能发微信用的互动小工具', sub: '掌握白嫖硅谷云端基建与轻量接单', track: 'vibe' },
          { id: 'g4', label: '给团队/公司部署离线知识库或自动对账流水线', sub: '数据保密不出内网，实打实降本增效', track: 'b2b' }
        ]
      }
    ];

    const PRESCRIPTIONS = {
      work: [
        { t: '处方 1：用“2 篇旧范文 + 禁用词围栏”根除公文 AI 味', d: '别把 AI 当许愿池！先将你过往受表扬的 2 段脱敏材料喂给 DeepSeek R1 / Claude 提取 5 大句式基因，再锁死禁用“赋能、抓手、闭环”，10 分钟出稳重定稿。' },
        { t: '处方 2：算力分离法洗 Excel（零泄密）', d: '严禁让大模型心算数字，也别传真实涉密表！只复制“2 行脱敏表头”让 AI 写精确函数公式或本地 Python/WPS 宏脚本，准确率 100%。' },
        { t: '处方 3：建 1 个“句句标页码”的岗位专属知识库', d: '用腾讯 IMA（支持微信聊天 PDF 一键入库）或 NotebookLM 挂载部门制度与标书，强制要求“仅基于知识库回答并标注页码”，彻底杜绝胡编。' }
      ],
      aigc: [
        { t: '处方 1：跨城降维复用“低粉爆文骨架”', d: '别自嗨写文案！去搜一二线城市粉丝 <5000 但点赞破千的近期同城笔记，让 AI 抽出前 3 秒钩子与情绪骨架，再 1:1 注入本地地标与痛点。' },
        { t: '处方 2：即梦 AI “双引号中文锁字法”做 3:4 封面', d: '用双引号锁死封面中文大字并预留顶部 30% 留白，配合主体参考功能固定 IP 形象不换脸，省下美工与棚拍成本。' },
        { t: '处方 3：“3+35+5 三明治结构”防数字人限流', d: '拍 1 分钟带“每两句闭嘴停顿 1 秒”的底板克隆分身，剪辑时前 3 秒和结尾 5 秒全屏出镜，中间 35 秒覆盖实拍/录屏素材，100% 绕过站桩查重。' }
      ],
      vibe: [
        { t: '处方 1：Plan-First 中文写 PRD，别一上来瞎改代码', d: '用 Cursor / Windsurf / Trae 先让 AI 写清楚单文件 HTML 的功能清单与数据结构，再一键生成带 Tailwind CSS 的完整单页应用。' },
        { t: '处方 2：白嫖 GitHub + Cloudflare Pages 10 秒全球上线', d: '零服务器费、免备案！代码推送到 GitHub 自动触发 Cloudflare Pages 发版，改一行字 10 秒全球手机扫码同步生效。' },
        { t: '处方 3：从“30 秒报价器 / 诊断页”切入商业小工具', d: '结合 LocalStorage 本地记忆与飞书多维表格收单，1 小时就能帮本地商家或自己在闲鱼交付高颜值轻应用。' }
      ],
      b2b: [
        { t: '处方 1：财务/经营数据坚持“本地 ETL 物理隔离”', d: '绝不把公司真账传给公网 AI！只用脱敏表头让 AI 生成本地 Python 自动对账脚本 + 离线单文件 ECharts 驾驶舱，断网 10 秒跑完十万行。' },
        { t: '处方 2：用“Dify + n8n + Coze”混合架构控成本', d: '前台对话用 Coze，企业级私有 RAG 知识库与政企离线内网用 Dify / Ollama + AnythingLLM，跨系统定时任务用 n8n 胶水层。' },
        { t: '处方 3：先做单部门 MVP 验证，再铺全公司', d: '优先从“外贸多语种询盘报价”或“200 页标书 ★ 号废标项扫描”这种 10 分钟立见真金白银的场景切入。' }
      ]
    };

    let currentStep = 0;
    const answers = {};
    let latestSummaryText = '';
    let echartsLoaded = false;
    let pendingRadarData = null;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.innerText = msg;
      el.classList.remove('hidden');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 2200);
    }

    function renderQuestion() {
      const q = QUESTIONS[currentStep];
      const chosenId = answers[q.id];
      document.getElementById('stepCounter').innerText = `第 ${currentStep + 1} / ${QUESTIONS.length} 题`;
      document.getElementById('quizProgressBar').style.width = `${((currentStep + 1) / QUESTIONS.length) * 100}%`;
      document.getElementById('prevBtn').classList.toggle('hidden', currentStep === 0);

      const box = document.getElementById('questionBox');
      box.innerHTML = `
        <div>
          <h2 class="text-base sm:text-lg font-extrabold text-white leading-snug">${q.title}</h2>
          <p class="text-xs text-slate-400 mt-1">${q.desc}</p>
        </div>
        <div class="space-y-2.5">
          ${q.options.map(opt => `
            <button type="button" onclick="selectOption('${q.id}', '${opt.id}')"
              class="opt-card w-full text-left p-3.5 rounded-2xl border bg-slate-950/70 border-slate-800 hover:border-slate-600 flex items-start justify-between gap-3 ${chosenId === opt.id ? 'opt-selected' : ''}">
              <div>
                <div class="text-xs sm:text-sm font-bold text-slate-100">${opt.label}</div>
                <div class="text-[11px] text-slate-400 mt-0.5">${opt.sub}</div>
              </div>
              <div class="w-5 h-5 rounded-full border shrink-0 mt-0.5 flex items-center justify-center ${chosenId === opt.id ? 'bg-emerald-500 border-emerald-400 text-slate-950' : 'border-slate-600'}">
                ${chosenId === opt.id ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
              </div>
            </button>
          `).join('')}
        </div>
      `;
      updateNextBtn();
    }

    function selectOption(qId, optId) {
      answers[qId] = optId;
      renderQuestion();
      // 自动丝滑跳转下一题（最后一题停留让用户确认）
      if (currentStep < QUESTIONS.length - 1) {
        setTimeout(() => {
          currentStep++;
          renderQuestion();
        }, 180);
      }
    }

    function updateNextBtn() {
      const q = QUESTIONS[currentStep];
      const hasVal = Boolean(answers[q.id]);
      const btn = document.getElementById('nextBtn');
      const isLast = currentStep === QUESTIONS.length - 1;
      btn.disabled = !hasVal;
      btn.innerHTML = isLast ? '生成我的诊断报告 <i class="fa-solid fa-wand-magic-sparkles ml-1"></i>' : '下一题 <i class="fa-solid fa-arrow-right ml-1"></i>';
      btn.className = hasVal
        ? 'text-xs bg-gradient-to-r from-emerald-500 to-blue-600 hover:opacity-95 text-white px-5 py-2.5 rounded-xl font-bold transition shadow-lg'
        : 'text-xs bg-slate-800 text-slate-500 px-5 py-2.5 rounded-xl font-bold transition cursor-not-allowed';
    }

    function prevQuestion() {
      if (currentStep > 0) {
        currentStep--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (!answers[QUESTIONS[currentStep].id]) return;
      if (currentStep < QUESTIONS.length - 1) {
        currentStep++;
        renderQuestion();
      } else {
        computeAndShowResult();
      }
    }

    function quickDemoFill() {
      answers.role = 'gov';
      answers.writing = 'w3';
      answers.data = 'd3';
      answers.pain = 'p2';
      answers.goal = 'g1';
      computeAndShowResult();
      showToast('已加载唐山职场白领模拟测评样本！');
    }

    function computeAndShowResult() {
      const roleOpt = QUESTIONS[0].options.find(o => o.id === answers.role) || QUESTIONS[0].options[0];
      const wOpt = QUESTIONS[1].options.find(o => o.id === answers.writing) || QUESTIONS[1].options[1];
      const dOpt = QUESTIONS[2].options.find(o => o.id === answers.data) || QUESTIONS[2].options[1];
      const pOpt = QUESTIONS[3].options.find(o => o.id === answers.pain) || QUESTIONS[3].options[1];
      const gOpt = QUESTIONS[4].options.find(o => o.id === answers.goal) || QUESTIONS[4].options[0];

      const rawHours = (roleOpt.hours + wOpt.hours * 0.62 + dOpt.hours * 0.65) * pOpt.mult;
      const weeklyHours = Math.min(22, Math.max(3.5, Math.round(rawHours * 10) / 10));
      const annualDays = Math.round((weeklyHours * 50) / 8);
      const score = Math.min(99, Math.max(62, Math.round(52 + weeklyHours * 2.6)));

      const radarVals = roleOpt.radar.map((base, i) => {
        const v = base + (wOpt.boost[i] || 0) * 0.45 + (dOpt.boost[i] || 0) * 0.45;
        return Math.min(98, Math.max(35, Math.round(v)));
      });

      let tier = 'A级 · 高潜提效型';
      let headline = '装上 2 套标准工作流，每周稳稳早下班 1 个整天';
      if (score >= 88) {
        tier = 'S级 · 极速跃迁型';
        headline = '你的工作含大量高重复痛点，是 AI 红利最大受益者！';
      } else if (score < 74) {
        tier = 'B级 · 精准外挂型';
        headline = '用好轻量垂直工具，可显著拉开同岗位专业差距';
      }

      document.getElementById('resTierBadge').innerText = `${tier} · 聚焦【${pOpt.tag}】`;
      document.getElementById('resHeadline').innerText = headline;
      document.getElementById('resWeeklyHours').innerText = `${weeklyHours}h`;
      document.getElementById('resAnnualDays').innerText = `${annualDays}天`;
      document.getElementById('resScore').innerText = `${score}分`;

      const pres = PRESCRIPTIONS[gOpt.track] || PRESCRIPTIONS.work;
      document.getElementById('prescriptionList').innerHTML = pres.map((p, idx) => `
        <div class="p-3.5 rounded-2xl bg-slate-950/80 border border-slate-800 space-y-1">
          <div class="font-bold text-emerald-300">${p.t}</div>
          <p class="text-slate-300 leading-relaxed">${p.d}</p>
        </div>
      `).join('');

      latestSummaryText = `📊 我刚测完《唐山打工人 AI 提效潜力 1 分钟诊断》：\n• 提效评级：${tier}（${score}分）\n• 预计每周可释放：${weeklyHours} 小时（全年约多出 ${annualDays} 个工作日！）\n• 当前最需突破：${pOpt.tag}\n• 建议优先落地：${pres[0].t}\n（纯免费无套路小工具，推荐测一下你的岗位能省多少时间）`;

      document.getElementById('quizPanel').classList.add('hidden');
      document.getElementById('resultPanel').classList.remove('hidden');

      pendingRadarData = radarVals;
      drawRadar(radarVals);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function drawRadar(values) {
      const dom = document.getElementById('radarChart');
      if (!dom) return;

      if (window.echarts) {
        if (dom._chart) dom._chart.dispose();
        const chart = window.echarts.init(dom);
        dom._chart = chart;
        chart.setOption({
          backgroundColor: 'transparent',
          radar: {
            radius: '64%',
            indicator: [
              { name: '公文/汇报', max: 100 },
              { name: '表格/对账', max: 100 },
              { name: '知识库RAG', max: 100 },
              { name: '视觉/内容', max: 100 },
              { name: '零代码造物', max: 100 }
            ],
            axisName: { color: '#cbd5e1', fontSize: 11, fontWeight: 'bold' },
            splitArea: { areaStyle: { color: ['rgba(30,41,59,0.55)', 'rgba(15,23,42,0.55)'] } },
            splitLine: { lineStyle: { color: 'rgba(148,163,184,0.2)' } },
            axisLine: { lineStyle: { color: 'rgba(148,163,184,0.2)' } }
          },
          series: [{
            type: 'radar',
            data: [{
              value: values,
              name: '提效杠杆',
              areaStyle: { color: 'rgba(52, 211, 153, 0.28)' },
              lineStyle: { color: '#34d399', width: 2.5 },
              itemStyle: { color: '#fbbf24' }
            }]
          }]
        });
        window.addEventListener('resize', () => chart.resize());
      } else {
        // 离线兜底条形图（即使断网也能完美显示）
        const labels = ['公文与汇报提效', '表格与数据自动化', '知识库零幻觉检索', '视觉与内容杠杆', '零代码工具造物'];
        dom.innerHTML = `<div class="space-y-2.5 pt-2">${values.map((v, i) => `
          <div class="space-y-1">
            <div class="flex justify-between text-[11px]"><span class="text-slate-300">${labels[i]}</span><span class="text-emerald-400 font-bold">${v} / 100</span></div>
            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-emerald-400 to-blue-500" style="width:${v}%"></div></div>
          </div>
        `).join('')}</div>`;
      }
    }

    function copyShareSummary() {
      if (!latestSummaryText) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(latestSummaryText).then(() => showToast('已复制诊断文案，可直接发朋友圈/小红书！'));
      } else {
        const ta = document.createElement('textarea');
        ta.value = latestSummaryText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制诊断文案！');
      }
    }

    function restartQuiz() {
      currentStep = 0;
      Object.keys(answers).forEach(k => delete answers[k]);
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('quizPanel').classList.remove('hidden');
      renderQuestion();
    }

    // 后台非阻塞加载 ECharts（国内多源降级）
    (function loadEChartsAsync() {
      const urls = [
        'https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js',
        'https://unpkg.com/echarts@5.5.0/dist/echarts.min.js'
      ];
      let idx = 0;
      function tryNext() {
        if (window.echarts || idx >= urls.length) return;
        const s = document.createElement('script');
        s.src = urls[idx++];
        s.async = true;
        s.onload = () => {
          echartsLoaded = true;
          if (pendingRadarData) drawRadar(pendingRadarData);
        };
        s.onerror = tryNext;
        document.head.appendChild(s);
      }
      tryNext();
    })();

    renderQuestion();
  </script>
</body>
</html>
